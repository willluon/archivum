name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: archivum
          POSTGRES_PASSWORD: archivum
          POSTGRES_DB: archivum
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U archivum"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://archivum:archivum@localhost:5432/archivum
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Migrations apply cleanly
        run: alembic upgrade head

      - name: Migrations are reversible
        run: alembic downgrade base && alembic upgrade head

      - name: Tests
        run: pytest -v
